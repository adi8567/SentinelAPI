apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinelapi-config
  namespace: sentinelapi
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
  STREAMING_BACKEND: "kafka"
  KAFKA_BOOTSTRAP_SERVERS: "kafka-service.sentinelapi.svc.cluster.local:9092"
  KAFKA_TOPIC_NORMALIZED_EVENTS: "sentinelapi.events.normalized"
  KAFKA_TOPIC_RAW_EVENTS: "sentinelapi.events.raw"
  STORAGE_BACKEND: "clickhouse"
  CLICKHOUSE_HOST: "clickhouse-service.sentinelapi.svc.cluster.local"
  CLICKHOUSE_PORT: "8123"
  CLICKHOUSE_DATABASE: "sentinelapi"
  TIMESCALE_HOST: "timescale-service.sentinelapi.svc.cluster.local"
  TIMESCALE_PORT: "5432"
  TIMESCALE_DATABASE: "sentinelapi"

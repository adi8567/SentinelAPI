global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "sentinelapi-backend"
    scrape_interval: 5s
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:8000", "localhost:8000"]

  - job_name: "sentinelapi-ingestion"
    scrape_interval: 5s
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:8000"]
